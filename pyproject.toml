[project]
name = "photoshare"
version = "0.1.0"
description = "PhotoShare REST API built with FastAPI"
authors = [{name = "Andrey Rybchenko"}]
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.52,<0.53",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.16,<2.0",
    "asyncpg>=0.30,<1.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "email-validator>=2.2,<3.0",
    "python-jose[cryptography]>=3.3,<4.0",
    "pwdlib[argon2]>=0.2,<1.0",
    "python-multipart>=0.0.20,<1.0",
    "cloudinary>=1.41,<2.0",
    "qrcode[pil]>=8.0,<9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "pytest-cov>=6.0,<7.0",
    "httpx>=0.28,<1.0",
    "aiosqlite>=0.20,<1.0",
    "sphinx (>=9.1,<10.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
